<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#eef2f7"/>
  
  <!-- Header bar -->
  <rect width="400" height="50" fill="#1f3a5f"/>
  <text x="20" y="32" font-family="Arial" font-size="18" font-weight="bold" fill="#fff">TechMart Dashboard</text>
  
  <!-- KPI Cards Row -->
  <g id="kpi-cards">
    <!-- Card 1 -->
    <rect x="20" y="70" width="85" height="60" fill="#fff" rx="4"/>
    <rect x="20" y="70" width="85" height="4" fill="#2a9d8f" rx="2"/>
    <text x="26" y="85" font-family="Arial" font-size="9" font-weight="bold" fill="#667085">REVENUE</text>
    <text x="26" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#1f3a5f">408M</text>
    
    <!-- Card 2 -->
    <rect x="110" y="70" width="85" height="60" fill="#fff" rx="4"/>
    <rect x="110" y="70" width="85" height="4" fill="#2a9d8f" rx="2"/>
    <text x="116" y="85" font-family="Arial" font-size="9" font-weight="bold" fill="#667085">PROFIT</text>
    <text x="116" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#1f3a5f">107M</text>
    
    <!-- Card 3 -->
    <rect x="200" y="70" width="85" height="60" fill="#fff" rx="4"/>
    <rect x="200" y="70" width="85" height="4" fill="#2a9d8f" rx="2"/>
    <text x="206" y="85" font-family="Arial" font-size="9" font-weight="bold" fill="#667085">MARGIN</text>
    <text x="206" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#1f3a5f">26.4%</text>
    
    <!-- Card 4 -->
    <rect x="290" y="70" width="90" height="60" fill="#fff" rx="4"/>
    <rect x="290" y="70" width="90" height="4" fill="#2a9d8f" rx="2"/>
    <text x="296" y="85" font-family="Arial" font-size="9" font-weight="bold" fill="#667085">ORDERS</text>
    <text x="296" y="120" font-family="Arial" font-size="16" font-weight="bold" fill="#1f3a5f">240</text>
  </g>
  
  <!-- Chart Area 1: Line Chart -->
  <g id="chart-line">
    <rect x="20" y="150" width="190" height="130" fill="#fff" rx="4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="26" y="167" font-family="Arial" font-size="11" font-weight="bold" fill="#1f3a5f">Monthly Trend</text>
    <polyline points="35,250 50,240 65,245 80,235 95,240 110,230 125,245 140,235 155,250 170,240 185,255 200,245" fill="none" stroke="#1f3a5f" stroke-width="2"/>
    <polyline points="35,260 50,255 65,260 80,250 95,258 110,248 125,263 140,253 155,265 170,258 185,268 200,260" fill="none" stroke="#2a9d8f" stroke-width="2"/>
  </g>
  
  <!-- Chart Area 2: Bar Chart -->
  <g id="chart-bar">
    <rect x="220" y="150" width="180" height="130" fill="#fff" rx="4" stroke="#e0e0e0" stroke-width="1"/>
    <text x="226" y="167" font-family="Arial" font-size="11" font-weight="bold" fill="#1f3a5f">By Region</text>
    <rect x="235" y="220" width="18" height="50" fill="#2a9d8f"/>
    <rect x="258" y="200" width="18" height="70" fill="#2a9d8f"/>
    <rect x="281" y="230" width="18" height="40" fill="#2a9d8f"/>
    <rect x="304" y="210" width="18" height="60" fill="#2a9d8f"/>
    <rect x="327" y="190" width="18" height="80" fill="#2a9d8f"/>
    <text x="235" y="285" font-family="Arial" font-size="8" fill="#667085">Dar</text>
    <text x="255" y="285" font-family="Arial" font-size="8" fill="#667085">Arusha</text>
    <text x="278" y="285" font-family="Arial" font-size="8" fill="#667085">Mwanza</text>
    <text x="298" y="285" font-family="Arial" font-size="8" fill="#667085">Dodoma</text>
    <text x="323" y="285" font-family="Arial" font-size="8" fill="#667085">Mbeya</text>
  </g>
</svg>